name: Android checks
on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'square-sandbox/**'
      - 'device-security/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - '.github/workflows/android.yml'
      - 'tools/annotated_android_build.py'
      - 'tools/complete_apk_metadata.py'
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  device-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual Android Keystore and mutual TLS
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          disable-animations: true
          script: ./gradlew -PincludeDeviceSecurityTests=true :device-security:connectedDebugAndroidTest :app:connectedDebugAndroidTest --no-daemon --console=plain
      - name: Report Android Keystore regression counts
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          paths=[p for root in ('device-security','app') for p in pathlib.Path(root+'/build/outputs/androidTest-results').rglob('TEST-*.xml')]
          if not paths:
              print('::warning::Android Keystore test results not available; do not infer a pass.')
          for path in paths:
              suite=ET.parse(path).getroot()
              counts=' '.join(key+'='+suite.get(key,'0') for key in ('tests','failures','errors','skipped'))
              print('::notice title=Android device regression::'+str(path)+' '+counts)
              for case in suite.findall('testcase'):
                  for failure in list(case.findall('failure'))+list(case.findall('error')):
                      # These UI/Keystore tests use synthetic fixtures and no runtime credentials.
                      message=case.get('classname','')+'.'+case.get('name','')+': '+failure.get('message','')[:1600]
                      print('::error::'+message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        continue-on-error: true # storage quota must not turn passing tests red
        with:
          name: android-keystore-regression-reports
          path: |
            device-security/build/outputs/androidTest-results/
            app/build/outputs/androidTest-results/
          retention-days: 7
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Unit tests, debug APK, Android lint
        run: python3 tools/annotated_android_build.py
      - name: Report exact complete-app package, digest and public signing fingerprint
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/complete_apk_metadata.py app/build/outputs/apk/debug/app-debug.apk complete-apk.json
      # Debug APKs (~110 MB each) are no longer kept: they exhausted the Actions storage quota.
      # Installable builds come from the signed live release (GitHub Releases, no Actions storage).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true # storage quota must not turn passing tests red
        with:
          name: android-reports
          path: |
            complete-apk.json
            app/build/reports/lint-results-debug.*
            core/build/reports/tests/test/
          retention-days: 3
