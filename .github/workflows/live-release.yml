name: Live release (organization-signed, real charges)
# Runs ONLY when an authorized person creates a tag like live-v0.4.0 or a branch like
# live-release/v0.4.0 (the deliberate approval step).
# Signing secrets are repository Actions secrets (GitHub Environments need a paid plan on private repos).
on:
  push:
    tags: ['live-v*']
    branches: ['live-release/**']
permissions:
  contents: write # publish the signed APK as a GitHub Release (does not use Actions artifact storage)
jobs:
  live-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Unit tests and unsigned live release APK
        run: ./gradlew :core:test :app:assembleRelease -PkollelLiveRelease=true --no-daemon --console=plain
      - name: Sign with the organization release key
        env:
          KEYSTORE_B64: ${{ secrets.KOLLEL_RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KOLLEL_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KOLLEL_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KS_PASS" && test -n "$KEY_ALIAS"
          NAME="${GITHUB_REF_NAME//\//-}"
          KS="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p out
          "$BT/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" \
            --out "out/kollel-kiosk-${NAME}.apk" out/aligned.apk
          rm out/aligned.apk
          "$BT/apksigner" verify --verbose --print-certs "out/kollel-kiosk-${NAME}.apk" | tee out/signature.txt
          (cd out && sha256sum *.apk > SHA256SUMS.txt && echo "source ${GITHUB_SHA}" >> SHA256SUMS.txt)
      - name: Publish signed APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          TAG="kiosk-v${VERSION}"
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Kollel Giving Kiosk ${VERSION} (live, organization-signed)" \
            --notes "Signed with the organization release key. Source ${GITHUB_SHA}. Install with adb install -r; see SETUP.md."
